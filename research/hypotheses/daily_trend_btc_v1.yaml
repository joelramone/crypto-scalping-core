  reserved_for_forward_confirmation: from_2026-11-01

signal:
  sma_lengths: [50, 100, 200]
  sma_includes_current_day: true
  vote: close[t] > sma_n[t]
  position: mean_of_three_votes
  position_values: [0, 0.3333333333, 0.6666666667, 1]
  decided: after_close_t
  held: open[t+1] -> open[t+2]
  cash_yield: 0
  warmup_days: 199
  benchmark_start: same_day_as_strategy
  prohibited_components: [volatility_targeting, stop_loss, filters, regime_classifier, leverage, shorting]

costs:
  fee_rate_per_unit_traded: 0.001
  charged_on: abs(position[t] - position[t-1])
  buy_and_hold: one_entry_fee
  slippage_modeled: false

metrics:
  windows: [full, first_half, second_half]
  split: midpoint_day_of_evaluation_window
  per_window: [cagr, annualized_volatility_365, sharpe_rf0, max_drawdown, calmar]
  extras: [time_in_market, position_changes, total_fees, calendar_year_returns]

verdict_rules:
  TREND_CANDIDATE_requires_all:
    - btc_full_strategy_cagr > 0
    - btc_full_strategy_sharpe > btc_full_buy_and_hold_sharpe
    - abs(btc_full_strategy_max_drawdown) <= 0.6 * abs(btc_full_buy_and_hold_max_drawdown)
    - btc_first_half_strategy_sharpe > btc_first_half_buy_and_hold_sharpe
    - btc_second_half_strategy_sharpe > btc_second_half_buy_and_hold_sharpe
    - eth_full_strategy_sharpe > eth_full_buy_and_hold_sharpe
  otherwise: TREND_REJECT
  candidate_next_step: forward_paper_tracking_from_2026-11-01_same_frozen_rule
  live_trading_authorized: false

anti_tuning_constraints:
  changing_sma_lengths_vote_timing_or_fees: prohibited
  adding_filters_leverage_shorting_or_vol_scaling: prohibited
  changing_window_or_split: prohibited
  swapping_control_asset: prohibited
  termination_rule: if_TREND_REJECT_this_hypothesis_ends
